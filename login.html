<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illapa Inn — Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    [v-cloak] { display: none; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div id="app" v-cloak class="w-full max-w-md">

    <!-- Tarjeta de Login -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Encabezado -->
      <div class="bg-slate-900 px-8 py-6 text-center">
        <div class="w-16 h-16 rounded-xl bg-amber-500 flex items-center justify-center font-bold text-slate-900 text-2xl mx-auto mb-3">
          II
        </div>
        <h1 class="text-white text-xl font-bold">Illapa Inn</h1>
        <p class="text-slate-400 text-sm mt-1">Sistema de Gestión Hotelera · Cusco</p>
      </div>

      <!-- Formulario -->
      <div class="px-8 py-8">
        <h2 class="text-lg font-semibold text-slate-800 mb-6 text-center">Iniciar Sesión</h2>

        <div v-if="error" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-center gap-2">
          <i class="fas fa-exclamation-circle"></i>
          {{ error }}
        </div>

        <div v-if="exito" class="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg flex items-center gap-2">
          <i class="fas fa-check-circle"></i>
          {{ exito }}
        </div>

        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Usuario</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                <i class="fas fa-user"></i>
              </span>
              <input v-model="usuario" type="text" placeholder="Ingrese su usuario"
                     class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Contraseña</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                <i class="fas fa-lock"></i>
              </span>
              <input v-model="password" :type="mostrarPassword ? 'text' : 'password'" placeholder="Ingrese su contraseña"
                     class="w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition" />
              <button type="button" @click="mostrarPassword = !mostrarPassword"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i :class="mostrarPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
          </div>

          <button @click="iniciarSesion"
                  class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold rounded-lg transition flex items-center justify-center gap-2">
            <i class="fas fa-sign-in-alt"></i>
            Ingresar al Sistema
          </button>
        </div>

        <!-- Credenciales de demostración -->
        <div class="mt-6 p-4 bg-slate-50 rounded-lg border border-slate-200">
          <p class="text-xs font-medium text-slate-500 mb-2">Credenciales de demostración:</p>
          <div class="text-sm space-y-1">
            <p><span class="font-medium text-slate-700">Usuario:</span> <code class="bg-slate-200 px-1.5 py-0.5 rounded text-amber-700">admin</code></p>
            <p><span class="font-medium text-slate-700">Contraseña:</span> <code class="bg-slate-200 px-1.5 py-0.5 rounded text-amber-700">admin123</code></p>
          </div>
        </div>
      </div>
    </div>

    <p class="text-center text-slate-400 text-xs mt-6">Illapa Inn · Cusco · Sistema de Gestión Operativa</p>
  </div>

  <script>
    const { createApp, ref } = Vue
    createApp({
      setup() {
        const usuario = ref('admin')
        const password = ref('admin123')
        const mostrarPassword = ref(false)
        const error = ref('')
        const exito = ref('')

        function iniciarSesion() {
          error.value = ''
          exito.value = ''
          if (usuario.value === 'admin' && password.value === 'admin123') {
            exito.value = 'Acceso correcto. Redirigiendo al panel de administración...'
          } else {
            error.value = 'Usuario o contraseña incorrectos'
          }
        }

        return { usuario, password, mostrarPassword, error, exito, iniciarSesion }
      }
    }).mount('#app')
  </script>
</body>
</html>
